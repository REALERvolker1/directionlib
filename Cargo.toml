[package]
name = "directionlib"
version = "0.1.1"
edition = "2024"

[dependencies]
arbitrary = { version = "1", default-features = false, optional = true }
bevy_ecs = { version = "0.18", default-features = false, optional = true }
bevy_reflect = { version = "0.18", default-features = false, optional = true }
bitflags = { version = "2", default-features = false }
bytemuck = { version = "1", default-features = false, optional = true }
defmt = { version = "1", default-features = false, optional = true }
glam = { version = "0.32", optional = true, default-features = false }
mint = { version = "0.5", default-features = false, optional = true }
nalgebra = { version = "0.34", default-features = false, optional = true }
num-traits = { version = "0.2", default-features = false, optional = true }
serde = { version = "1", default-features = false, optional = true }
serde_derive = { version = "1", default-features = false, optional = true }

[features]
default = []
serde = ["dep:serde", "dep:serde_derive", "bitflags/serde"]
defmt = ["dep:defmt"]
bevy_reflect = ["dep:bevy_reflect"]
bevy_ecs = ["dep:bevy_ecs"]
num-traits = ["dep:num-traits"]
bytemuck = ["dep:bytemuck", "bitflags/bytemuck"]
arbitrary = ["dep:arbitrary"]
glam = ["dep:glam"]
glam_std = ["glam", "glam/std"]
glam_libm = ["glam", "glam/libm"]
glam_nostd-libm = ["glam", "glam/nostd-libm"]
mint = ["dep:mint"]
nalgebra = ["dep:nalgebra"]

# [dev-dependencies]
# glam = { version = "0.32", optional = true, default-features = false, features = "glam_std" }
